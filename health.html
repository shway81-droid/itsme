<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>건강 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#0B2239; --ink-soft:#1B3A57; --teal:#0E7C7B; --teal-deep:#0A5C5B;
    --warm:#C2554D; --amber:#B7791F; --indigo:#4C5FA8;
    --surface:#FBFCFD; --surface-2:#F2F5F7; --slate:#5A6B7A; --hair:#E2E8ED;
    --max:1080px;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--surface);line-height:1.6;-webkit-font-smoothing:antialiased}
  ::selection{background:var(--teal);color:#fff}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 28px}
  .eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.04em;color:var(--teal);font-weight:500;display:inline-block;margin-bottom:14px}
  .eyebrow::before{content:"// "}

  nav{position:sticky;top:0;z-index:50;backdrop-filter:saturate(160%) blur(10px);background:rgba(251,252,253,.82);border-bottom:1px solid var(--hair)}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
  .brand{font-family:var(--mono);font-weight:700;font-size:.92rem;letter-spacing:-.01em}
  .brand b{color:var(--teal)}
  .navlinks{display:flex;gap:20px;font-size:.86rem;color:var(--slate)}
  .navlinks a:hover{color:var(--ink)}

  header.head{padding:56px 0 34px}
  .head h1{font-size:clamp(1.7rem,4.4vw,2.5rem);font-weight:800;letter-spacing:-.03em;line-height:1.2}
  .head .sub{margin-top:12px;color:var(--ink-soft);font-size:1rem}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);background:var(--surface-2)}
  .stat{padding:24px 20px;border-left:1px solid var(--hair)}
  .stat:first-child{border-left:none;padding-left:0}
  .stat .lab{font-family:var(--mono);font-size:.7rem;color:var(--slate);letter-spacing:.02em}
  .stat .num{margin-top:8px;font-size:1.7rem;font-weight:800;letter-spacing:-.03em;line-height:1}
  .stat .num small{font-size:.85rem;font-weight:600;color:var(--slate);letter-spacing:0}
  .stat .note{margin-top:7px;font-size:.78rem;color:var(--slate)}
  .down{color:var(--teal)} .up{color:var(--warm)}
  @media(max-width:820px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .stat{border-top:1px solid var(--hair)}
    .stat:nth-child(odd){border-left:none;padding-left:0}
    .stat:nth-child(-n+2){border-top:none}
  }

  section{padding:48px 0}
  section+section{padding-top:0}
  .sec-title{font-size:1.15rem;font-weight:700;letter-spacing:-.02em}
  .sec-lead{margin-top:6px;font-size:.88rem;color:var(--slate);max-width:60ch}
  .sec-bar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .sec-note{font-family:var(--mono);font-size:.72rem;color:var(--slate)}

  .ranges{display:flex;gap:6px}
  .rbtn{font-family:var(--mono);font-size:.74rem;padding:7px 13px;border-radius:7px;border:1px solid var(--hair);
        background:#fff;color:var(--slate);cursor:pointer;transition:border-color .18s,color .18s,background .18s}
  .rbtn:hover{border-color:var(--teal);color:var(--teal)}
  .rbtn.on{background:var(--ink);border-color:var(--ink);color:#fff}

  .card{border:1px solid var(--hair);border-radius:12px;background:#fff;padding:18px 16px 12px}
  .card svg{display:block;width:100%}
  .grid line{stroke:var(--hair)}
  .axis text{font-family:var(--mono);font-size:10px;fill:var(--slate)}
  .lane-lab{font-family:var(--mono);font-size:10px;font-weight:700;fill:var(--slate)}
  .val{font-family:var(--mono);font-size:9.5px;font-weight:700;fill:var(--ink-soft);stroke:#fff;stroke-width:3;paint-order:stroke}
  .w-line{fill:none;stroke:var(--teal);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
  .w-ma{fill:none;stroke:var(--ink-soft);stroke-width:1.4;stroke-dasharray:5 4;opacity:.6}
  .w-dot{fill:#fff;stroke:var(--teal);stroke-width:2}
  .sleep-band{fill:var(--indigo);opacity:.85}
  .lane-sep{stroke:var(--hair);stroke-dasharray:2 3}
  .today{stroke:var(--warm);stroke-width:1.1;stroke-dasharray:3 3;opacity:.55}

  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;padding:0 4px 4px;font-size:.76rem;color:var(--slate)}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:6px}
  .lg-w i{background:var(--teal);border-radius:50%}
  .lg-c i{background:var(--teal)} .lg-p i{background:var(--ink-soft)} .lg-f i{background:var(--amber)}
  .lg-s i{background:var(--indigo)}
  .lg-ma i{width:16px;height:0;border-radius:0;border-top:2px dashed var(--ink-soft);vertical-align:middle}

  table{width:100%;border-collapse:collapse}
  th,td{padding:11px 9px;text-align:right;font-size:.88rem;border-top:1px solid var(--hair)}
  th{font-family:var(--mono);font-size:.7rem;font-weight:500;color:var(--slate);border-top:none}
  th:first-child,td:first-child{text-align:left;padding-left:0}
  th:last-child,td:last-child{padding-right:0}
  td.d{font-family:var(--mono);font-size:.8rem;white-space:nowrap}
  td.m{font-family:var(--mono);font-weight:700}
  td.q{color:var(--slate);font-size:.83rem;text-align:left}
  tbody tr:hover{background:var(--surface-2)}
  @media(max-width:560px){ th,td{padding:10px 5px} td.d{font-size:.74rem} .yr{display:none} }

  .day{border-top:1px solid var(--hair);padding:18px 0}
  .day:first-child{border-top:none}
  .day-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
  .day-date{font-family:var(--mono);font-size:.85rem;font-weight:700}
  .day-sum{font-family:var(--mono);font-size:.79rem;color:var(--slate)}
  .day-sum b{color:var(--ink);font-size:.9rem}
  .meal{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:baseline;padding:6px 0}
  .meal-t{font-family:var(--mono);font-size:.72rem;color:var(--teal)}
  .meal-at{display:block;font-size:.65rem;color:var(--slate);margin-top:1px}
  .meal-n{font-size:.9rem}
  .meal-n .macro{display:block;font-family:var(--mono);font-size:.69rem;color:var(--slate);margin-top:2px}
  .meal-k{font-family:var(--mono);font-size:.88rem;font-weight:700;white-space:nowrap}
  @media(max-width:560px){ .meal{grid-template-columns:44px 1fr auto;gap:9px} .meal-n{font-size:.85rem} }

  .empty{border:1px dashed var(--hair);border-radius:12px;padding:34px 22px;text-align:center;color:var(--slate);font-size:.9rem}
  footer{border-top:1px solid var(--hair);padding:28px 0;background:var(--surface-2);margin-top:32px}
  footer .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
  footer span{font-family:var(--mono);font-size:.72rem;color:var(--slate)}
  .hide{display:none !important}
</style>
</head>

  sleep  : {"d":"2026-08-26","bed":"21:31","wake":"06:31","min":540,"q":"좋음"}
           d = **잠자리에 든 날짜** (앱은 기상 날짜로 표시하므로 하루 뺀다)

-->

<script>
(function(){
  var DAY=86400000, WD=['일','월','화','수','목','금','토'];
  var raw=JSON.parse(document.getElementById('health-data').textContent);
  var cfg=raw.config||{};
  var num=function(v){ return typeof v==='number' ? v : null; };
  var target=num(cfg.target), height=num(cfg.height), goalKcal=num(cfg.goalKcal), targetMin=num(cfg.targetMin);

  function t0(d){ return new Date(d+'T00:00:00').getTime(); }
  function md(t){ var x=new Date(t); return ('0'+(x.getMonth()+1)).slice(-2)+'.'+('0'+x.getDate()).slice(-2); }
  function full(t){ var x=new Date(t); return x.getFullYear()+'.'+md(t)+' ('+WD[x.getDay()]+')'; }
  function rowD(t){ var x=new Date(t); return '<span class="yr">'+x.getFullYear()+'.</span>'+md(t)+' ('+WD[x.getDay()]+')'; }
  function nw(v){ return v.toFixed(2); }
  function sgn(v){ return (v>0?'+':v<0?'−':'±')+nw(Math.abs(v)); }
  function cls(v){ return v<0?'down':v>0?'up':''; }
  function k(v){ return Math.round(v).toLocaleString('en-US'); }
  function hm(s){ var p=String(s||'').split(':'); return (+p[0])*60+(+p[1]||0); }
  function dur(m){ var h=Math.floor(m/60), r=m%60; return r? h+'시간 '+r+'분' : h+'시간'; }
  function esc(s){ return String(s).replace(/</g,'&lt;'); }

  /* ---------- 정규화 ---------- */
  var W=(raw.weight||[]).filter(function(e){return e&&e.d&&typeof e.w==='number';})
        .map(function(e){return {d:e.d,w:e.w,memo:e.memo||'',t:t0(e.d)};})
        .sort(function(a,b){return a.t-b.t;});

  var Mall=(raw.meals||[]).filter(function(e){return e&&e.d&&typeof e.kcal==='number';})
        .map(function(e){return {d:e.d,t:e.t||'',at:e.at||'',n:e.n||'',kcal:e.kcal,
             c:e.c||0,p:e.p||0,f:e.f||0,served:num(e.served),ate:num(e.ate),t0:t0(e.d)};});
  var MD=[], mByT={};
  Mall.forEach(function(e){
    if(!mByT[e.t0]){ mByT[e.t0]={t:e.t0,kcal:0,c:0,p:0,f:0,items:[]}; MD.push(mByT[e.t0]); }
    var d=mByT[e.t0]; d.kcal+=e.kcal; d.c+=e.c; d.p+=e.p; d.f+=e.f; d.items.push(e);
  });
  MD.sort(function(a,b){return a.t-b.t;});

  var S=(raw.sleep||[]).filter(function(e){return e&&e.d&&e.bed&&e.wake;})
        .map(function(e){ var b=hm(e.bed), w=hm(e.wake), span=((w-b)+1440)%1440;
             return {d:e.d,bed:e.bed,wake:e.wake,b:b,w:w,span:span,
                     min:(typeof e.min==='number'?e.min:span),q:e.q||'',t:t0(e.d)};})
        .sort(function(a,b){return a.t-b.t;});
  var sByT={}; S.forEach(function(e){ sByT[e.t]=e; });
  var wByT={}; W.forEach(function(e){ wByT[e.t]=e; });

  /* 체중 7일 이동평균 (캘린더 기준) */
  var maByT={};
  W.forEach(function(e){
    var from=e.t-6*DAY, s=0, n=0;
    W.forEach(function(x){ if(x.t>=from&&x.t<=e.t){ s+=x.w; n++; } });
    maByT[e.t]={v:s/n,n:n};
  });

  /* ---------- 지표 ---------- */
  function renderStats(){
    var cards=[];
    if(W.length){
      var last=W[W.length-1], prev=W.length>1?W[W.length-2]:null;
      cards.push('<div class="stat"><div class="lab">최신 체중</div><div class="num">'+nw(last.w)+'<small> kg</small></div>'+
        '<div class="note">'+full(last.t)+(height?' · BMI '+(last.w/Math.pow(height/100,2)).toFixed(1):'')+'</div></div>');
      cards.push('<div class="stat"><div class="lab">7일 평균 대비</div>'+
        (prev? '<div class="num '+cls(last.w-prev.w)+'">'+sgn(last.w-prev.w)+'<small> kg</small></div>'+
               '<div class="note">전일 '+nw(prev.w)+' · 7일평균 '+nw(maByT[last.t].v)+'</div>'
             : '<div class="num"><small>첫 기록</small></div><div class="note">비교는 2일차부터</div>')+'</div>');
    }
    if(MD.length){
      var ld=MD[MD.length-1];
      cards.push('<div class="stat"><div class="lab">최근 기록일 섭취</div><div class="num">'+k(ld.kcal)+'<small> kcal</small></div>'+
        '<div class="note">'+full(ld.t)+' · '+ld.items.length+'회</div></div>');
    } else cards.push('<div class="stat"><div class="lab">섭취</div><div class="num"><small>기록 없음</small></div><div class="note">&nbsp;</div></div>');
    if(S.length){
      var ls=S[S.length-1];
      cards.push('<div class="stat"><div class="lab">최근 수면</div><div class="num">'+dur(ls.min)+'</div>'+
        '<div class="note">'+md(ls.t)+' 밤 · '+ls.bed+'~'+ls.wake+'</div></div>');
    } else cards.push('<div class="stat"><div class="lab">수면</div><div class="num"><small>기록 없음</small></div><div class="note">&nbsp;</div></div>');
    document.getElementById('stats').innerHTML=cards.join('');
    document.getElementById('head-sub').textContent=
      '체중 · 식사 · 수면을 한 화면에서 봅니다. · 체중 '+W.length+'일 · 식사 '+MD.length+'일 · 수면 '+S.length+'일';
    var lastD=[W.length?W[W.length-1].d:'', MD.length?MD[MD.length-1].items[0].d:'', S.length?S[S.length-1].d:'']
              .filter(Boolean).sort();
    if(lastD.length) document.getElementById('foot-note').textContent='last update '+lastD[lastD.length-1];
  }

  /* ---------- 통합 타임라인 ---------- */
  var state={range:0};
  function niceStep(span,ticks){
    var raw=(span||1)/ticks, mag=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/mag;
    return (n<=1?1:n<=2?2:n<=5?5:10)*mag;
  }
  function drawTimeline(){
    var svg=document.getElementById('tl');
    var all=[].concat(W.map(function(e){return e.t;}), MD.map(function(e){return e.t;}), S.map(function(e){return e.t;}));
    if(!all.length){ svg.innerHTML=''; return; }
    var end=Math.max.apply(null,all), start=Math.min.apply(null,all);
    if(state.range) start=Math.max(start, end-(state.range-1)*DAY);
    var days=[]; for(var t=start;t<=end;t+=DAY) days.push(t);

    var Wd=svg.parentNode.clientWidth||900;
    var P={t:26,r:14,b:26,l:58};
    var LH=[110,90,90], GAP=30;                       /* 체중 / 식사 / 수면 레인 높이 */
    var H=P.t+P.b+LH[0]+LH[1]+LH[2]+GAP*2;
    var iw=Math.max(10,Wd-P.l-P.r);
    var cw=iw/days.length;
    var X=function(i){ return P.l+(i+0.5)*cw; };
    var y0=[P.t, P.t+LH[0]+GAP, P.t+LH[0]+LH[1]+GAP*2];
    var s=[];

    /* 레인 구분선 + 이름 */
    ['체중','식사','수면'].forEach(function(nm,i){
      s.push('<text class="lane-lab" x="'+P.l+'" y="'+(y0[i]-9)+'">'+nm+'</text>');
      if(i) s.push('<line class="lane-sep" x1="'+P.l+'" y1="'+(y0[i]-GAP*0.62)+'" x2="'+(P.l+iw)+'" y2="'+(y0[i]-GAP*0.62)+'"/>');
    });

    /* --- 레인 1: 체중 --- */
    var wIn=days.map(function(t){return wByT[t];}).filter(Boolean);
    if(wIn.length){
      var vals=wIn.map(function(e){return e.w;}).concat(wIn.map(function(e){return maByT[e.t].v;}));
      var lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals);
      var pad=Math.max((hi-lo)*0.18,0.35);
      var st=niceStep((hi+pad)-(lo-pad),2);
      var yMin=Math.floor((lo-pad)/st)*st, yMax=Math.ceil((hi+pad)/st)*st;
      var dec=Math.max(0,-Math.floor(Math.log10(st)));
      var Y1=function(v){ return y0[0]+(yMax-v)/(yMax-yMin)*LH[0]; };
      s.push('<g class="grid">');
      for(var v=yMin;v<=yMax+1e-9;v+=st) s.push('<line x1="'+P.l+'" y1="'+Y1(v).toFixed(1)+'" x2="'+(P.l+iw)+'" y2="'+Y1(v).toFixed(1)+'"/>');
      s.push('</g><g class="axis">');
      for(var v2=yMin;v2<=yMax+1e-9;v2+=st) s.push('<text x="'+(P.l-7)+'" y="'+(Y1(v2)+3.5).toFixed(1)+'" text-anchor="end">'+v2.toFixed(dec)+'</text>');
      s.push('</g>');
      var dl='',dm='';
      days.forEach(function(t,i){
        var e=wByT[t]; if(!e) return;
        dl+=(dl?'L':'M')+X(i).toFixed(1)+' '+Y1(e.w).toFixed(1);
        dm+=(dm?'L':'M')+X(i).toFixed(1)+' '+Y1(maByT[t].v).toFixed(1);
      });
      if(dm) s.push('<path class="w-ma" d="'+dm+'"/>');
      if(dl) s.push('<path class="w-line" d="'+dl+'"/>');
      if(cw>14) days.forEach(function(t,i){ if(wByT[t]) s.push('<circle class="w-dot" cx="'+X(i).toFixed(1)+'" cy="'+Y1(wByT[t].w).toFixed(1)+'" r="2.8"/>'); });
      var lw=wIn[wIn.length-1];
      s.push('<text class="val" x="'+(P.l+iw)+'" y="'+(Y1(lw.w)-7).toFixed(1)+'" text-anchor="end">'+nw(lw.w)+'kg</text>');
    } else s.push('<text class="axis" x="'+(P.l+iw/2)+'" y="'+(y0[0]+LH[0]/2)+'" text-anchor="middle" style="font-size:11px;fill:#9aa8b4">기록 없음</text>');

    /* --- 레인 2: 식사 (탄단지 누적) --- */
    var mIn=days.map(function(t){return mByT[t];}).filter(Boolean);
    if(mIn.length){
      var top=Math.max.apply(null,mIn.map(function(e){return e.kcal;}).concat(goalKcal?[goalKcal]:[0]));
      var st2=top>2500?1000:top>800?500:top>300?200:100;
      var kMax=Math.max(st2,Math.ceil(top*1.14/st2)*st2);
      st2=kMax/2;                                     /* 0·중간·최대 세 눈금만 — 옆 레인과 겹치지 않게 */
      var Y2=function(v){ return y0[1]+LH[1]-v/kMax*LH[1]; };
      s.push('<g class="grid">');
      for(var v3=0;v3<=kMax+1e-9;v3+=st2) s.push('<line x1="'+P.l+'" y1="'+Y2(v3).toFixed(1)+'" x2="'+(P.l+iw)+'" y2="'+Y2(v3).toFixed(1)+'"/>');
      s.push('</g><g class="axis">');
      for(var v4=0;v4<=kMax+1e-9;v4+=st2) s.push('<text x="'+(P.l-7)+'" y="'+(Y2(v4)+3.5).toFixed(1)+'" text-anchor="end">'+k(v4)+'</text>');
      s.push('</g>');
      if(goalKcal) s.push('<line class="today" x1="'+P.l+'" y1="'+Y2(goalKcal).toFixed(1)+'" x2="'+(P.l+iw)+'" y2="'+Y2(goalKcal).toFixed(1)+'"/>');
      var bw=Math.min(30,cw*0.62);
      days.forEach(function(t,i){
        var d=mByT[t]; if(!d||!d.kcal) return;
        var x=X(i)-bw/2, base=Y2(0);
        var mk=d.c*4+d.p*4+d.f*9;
        var segs = mk ? [[d.c*4/mk*d.kcal,'var(--teal)'],[d.p*4/mk*d.kcal,'var(--ink-soft)'],[d.f*9/mk*d.kcal,'var(--amber)']]
                      : [[d.kcal,'var(--teal)']];
        segs.forEach(function(sg){
          var h=sg[0]/kMax*LH[1]; if(h<=0) return;
          base-=h;
          s.push('<rect x="'+x.toFixed(1)+'" y="'+base.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+sg[1]+'"/>');
        });
        if(cw>26) s.push('<text class="val" x="'+X(i).toFixed(1)+'" y="'+(Y2(d.kcal)-5).toFixed(1)+'" text-anchor="middle">'+k(d.kcal)+'</text>');
      });
    } else s.push('<text class="axis" x="'+(P.l+iw/2)+'" y="'+(y0[1]+LH[1]/2)+'" text-anchor="middle" style="font-size:11px;fill:#9aa8b4">기록 없음</text>');

    /* --- 레인 3: 수면 (세로 띠 = 취침~기상 시간대) --- */
    var SP=18*60;                                        /* 18:00 → 다음날 12:00 */
    var pos=function(m){ return ((m-18*60)+1440)%1440; };
    var Y3=function(p){ return y0[2]+Math.max(0,Math.min(SP,p))/SP*LH[2]; };
    s.push('<g class="grid">');
    [0,6,12].forEach(function(h){ s.push('<line x1="'+P.l+'" y1="'+Y3(h*60).toFixed(1)+'" x2="'+(P.l+iw)+'" y2="'+Y3(h*60).toFixed(1)+'"/>'); });
    s.push('</g><g class="axis">');
    [0,6,12].forEach(function(h){
      s.push('<text x="'+(P.l-7)+'" y="'+(Y3(h*60)+3.5).toFixed(1)+'" text-anchor="end">'+('0'+((18+h)%24)).slice(-2)+':00</text>');
    });
    s.push('</g>');
    var sIn=days.map(function(t){return sByT[t];}).filter(Boolean);
    if(sIn.length){
      var sw=Math.min(24,cw*0.5);
      days.forEach(function(t,i){
        var e=sByT[t]; if(!e) return;
        var yA=Y3(pos(e.b)), yB=Y3(pos(e.b)+e.span);
        s.push('<rect class="sleep-band" x="'+(X(i)-sw/2).toFixed(1)+'" y="'+yA.toFixed(1)+'" width="'+sw.toFixed(1)+'" height="'+Math.max(2,yB-yA).toFixed(1)+'" rx="3"/>');
        if(cw>26) s.push('<text class="val" x="'+X(i).toFixed(1)+'" y="'+(yB+11).toFixed(1)+'" text-anchor="middle">'+(e.min/60).toFixed(1)+'h</text>');
      });
    } else s.push('<text class="axis" x="'+(P.l+iw/2)+'" y="'+(y0[2]+LH[2]/2)+'" text-anchor="middle" style="font-size:11px;fill:#9aa8b4">기록 없음</text>');

    /* --- 날짜 축 --- */
    s.push('<g class="axis">');
    var maxLab=Wd<520?4:8, stepI=Math.max(1,Math.ceil(days.length/maxLab)), lastX=-Infinity;
    days.forEach(function(t,i){
      if(i%stepI) return;
      var x=X(i); if(x-lastX<44) return; lastX=x;
      s.push('<text x="'+x.toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+md(t)+'</text>');
    });
    s.push('</g>');

    svg.setAttribute('viewBox','0 0 '+Wd+' '+H);
    svg.setAttribute('height',H);
    svg.innerHTML=s.join('');
    document.getElementById('w-note').textContent='전체 '+W.length+'일';
  }

  /* ---------- 표 ---------- */
  function renderTables(){
    document.getElementById('w-body').innerHTML = W.length ? W.slice(-14).reverse().map(function(e){
      var i=W.indexOf(e), prev=i>0?W[i-1]:null, d=prev?e.w-prev.w:null;
      return '<tr><td class="d">'+rowD(e.t)+'</td><td class="q">'+esc(e.memo)+'</td>'+
             '<td class="'+(d===null?'':cls(d))+'">'+(d===null?'—':sgn(d))+'</td>'+
             '<td class="m">'+nw(e.w)+'</td></tr>';
    }).join('') : '<tr><td colspan="4" class="q">기록 없음</td></tr>';

    document.getElementById('m-list').innerHTML = MD.length ? MD.slice(-7).reverse().map(function(d){
      var mk=d.c*4+d.p*4+d.f*9;
      return '<div class="day"><div class="day-head"><span class="day-date">'+full(d.t)+'</span>'+
        '<span class="day-sum"><b>'+k(d.kcal)+' kcal</b>'+(mk?' · 탄 '+Math.round(d.c)+' / 단 '+Math.round(d.p)+' / 지 '+Math.round(d.f)+' g':'')+
        ' · '+d.items.length+'회</span></div>'+
        d.items.map(function(m){
          var bits=[];
          if(m.c||m.p||m.f) bits.push('탄 '+m.c+' · 단 '+m.p+' · 지 '+m.f+' g');
          if(m.ate!==null&&m.ate<1) bits.push('차린 '+(m.served!==null?k(m.served)+' kcal 중 ':'')+Math.round(m.ate*100)+'% 섭취');
          return '<div class="meal"><span class="meal-t">'+(m.t||'—')+(m.at?'<span class="meal-at">'+m.at+'</span>':'')+'</span>'+
            '<span class="meal-n">'+esc(m.n)+(bits.length?'<span class="macro">'+bits.join(' · ')+'</span>':'')+'</span>'+
            '<span class="meal-k">'+k(m.kcal)+'</span></div>';
        }).join('')+'</div>';
    }).join('') : '<div class="empty">기록 없음</div>';
    document.getElementById('m-note').textContent = MD.length>7 ? '최근 7일 / 전체 '+MD.length+'일' : '전체 '+MD.length+'일';

    document.getElementById('s-body').innerHTML = S.length ? S.slice(-14).reverse().map(function(e){
      return '<tr><td class="d">'+rowD(e.t)+'</td><td class="q">'+esc(e.q)+'</td>'+
             '<td class="m" style="font-weight:400">'+e.bed+'</td><td class="m" style="font-weight:400">'+e.wake+'</td>'+
             '<td class="m">'+dur(e.min)+'</td></tr>';
    }).join('') : '<tr><td colspan="5" class="q">기록 없음</td></tr>';
    document.getElementById('s-note').textContent='전체 '+S.length+'일';
  }

  renderStats(); renderTables(); drawTimeline();
  document.getElementById('ranges').addEventListener('click', function(ev){
    var b=ev.target.closest('.rbtn'); if(!b) return;
    state.range=parseInt(b.dataset.range,10);
    Array.prototype.forEach.call(this.querySelectorAll('.rbtn'), function(x){ x.classList.toggle('on', x===b); });
    drawTimeline();
  });
  var rt; window.addEventListener('resize', function(){ clearTimeout(rt); rt=setTimeout(drawTimeline,120); });
})();
</script>
</body>
</html>
