<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>매일 식사 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#0B2239; --ink-soft:#1B3A57; --teal:#0E7C7B; --teal-deep:#0A5C5B;
    --warm:#C2554D; --amber:#B7791F;
    --surface:#FBFCFD; --surface-2:#F2F5F7; --slate:#5A6B7A; --hair:#E2E8ED;
    --max:1080px;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--surface);line-height:1.6;-webkit-font-smoothing:antialiased}
  ::selection{background:var(--teal);color:#fff}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 28px}
  .eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.04em;color:var(--teal);font-weight:500;display:inline-block;margin-bottom:14px}
  .eyebrow::before{content:"// "}

  nav{position:sticky;top:0;z-index:50;backdrop-filter:saturate(160%) blur(10px);background:rgba(251,252,253,.82);border-bottom:1px solid var(--hair)}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
  .brand{font-family:var(--mono);font-weight:700;font-size:.92rem;letter-spacing:-.01em}
  .brand b{color:var(--teal)}
  .navlinks{display:flex;gap:22px;font-size:.86rem;color:var(--slate)}
  .navlinks a:hover{color:var(--ink)}

  header.head{padding:56px 0 34px}
  .head h1{font-size:clamp(1.7rem,4.4vw,2.5rem);font-weight:800;letter-spacing:-.03em;line-height:1.2}
  .head .sub{margin-top:12px;color:var(--ink-soft);font-size:1rem}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);background:var(--surface-2)}
  .stat{padding:26px 20px;border-left:1px solid var(--hair)}
  .stat:first-child{border-left:none;padding-left:0}
  .stat .lab{font-family:var(--mono);font-size:.7rem;color:var(--slate);letter-spacing:.02em}
  .stat .num{margin-top:8px;font-size:1.85rem;font-weight:800;letter-spacing:-.03em;line-height:1}
  .stat .num small{font-size:.9rem;font-weight:600;color:var(--slate);letter-spacing:0}
  .stat .note{margin-top:7px;font-size:.78rem;color:var(--slate)}
  @media(max-width:820px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .stat{border-top:1px solid var(--hair)}
    .stat:nth-child(odd){border-left:none;padding-left:0}
    .stat:nth-child(-n+2){border-top:none}
  }

  section{padding:52px 0}
  .sec-title{font-size:1.15rem;font-weight:700;letter-spacing:-.02em}
  .sec-bar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .sec-note{font-family:var(--mono);font-size:.72rem;color:var(--slate)}

  .chart-card{border:1px solid var(--hair);border-radius:12px;background:#fff;padding:18px 16px 12px}
  .chart-wrap{width:100%}
  .chart-wrap svg{display:block;width:100%}
  .grid line{stroke:var(--hair)}
  .axis text{font-family:var(--mono);font-size:10px;fill:var(--slate)}
  /* 평균선이 지나가도 읽히도록 흰 테두리를 깔아준다 */
  .barval{font-family:var(--mono);font-size:10px;font-weight:700;fill:var(--ink-soft);stroke:#fff;stroke-width:3;paint-order:stroke}
  .line-avg{fill:none;stroke:var(--ink-soft);stroke-width:1.4;stroke-dasharray:5 4;opacity:.65}
  .line-goal{stroke:var(--warm);stroke-width:1.3;stroke-dasharray:3 4;opacity:.8}

  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;padding:0 4px 4px;font-size:.76rem;color:var(--slate)}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:6px}
  .lg-c i{background:var(--teal)} .lg-p i{background:var(--ink-soft)} .lg-f i{background:var(--amber)}
  .lg-avg i{width:16px;height:0;border-radius:0;border-top:2px dashed var(--ink-soft);vertical-align:middle}
  .lg-goal i{width:16px;height:0;border-radius:0;border-top:2px dashed var(--warm);vertical-align:middle}

  /* 식사 목록 */
  .day{border-top:1px solid var(--hair);padding:20px 0}
  .day:first-child{border-top:none}
  .day-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:12px;flex-wrap:wrap}
  .day-date{font-family:var(--mono);font-size:.86rem;font-weight:700}
  .day-sum{font-family:var(--mono);font-size:.8rem;color:var(--slate)}
  .day-sum b{color:var(--ink);font-size:.92rem}
  .meal{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:baseline;padding:7px 0}
  .meal-t{font-family:var(--mono);font-size:.72rem;color:var(--teal)}
  .meal-at{display:block;font-size:.66rem;color:var(--slate);margin-top:1px}
  .meal-n{font-size:.92rem}
  .meal-n .macro{display:block;font-family:var(--mono);font-size:.7rem;color:var(--slate);margin-top:2px}
  .meal-k{font-family:var(--mono);font-size:.9rem;font-weight:700;white-space:nowrap}
  @media(max-width:560px){
    .meal{grid-template-columns:44px 1fr auto;gap:10px}
    .meal-n{font-size:.86rem}
  }

  .empty{border:1px dashed var(--hair);border-radius:12px;padding:48px 24px;text-align:center;color:var(--slate)}
  .empty b{display:block;color:var(--ink);font-size:1.02rem;margin-bottom:8px}
  .empty code{font-family:var(--mono);font-size:.82rem;background:var(--surface-2);padding:3px 7px;border-radius:5px;color:var(--ink-soft)}

  footer{border-top:1px solid var(--hair);padding:28px 0;background:var(--surface-2);margin-top:24px}
  footer .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
  footer span{font-family:var(--mono);font-size:.72rem;color:var(--slate)}
  .hide{display:none !important}
</style>
</head>
<body>

<!--
  ── 기록 방법 ────────────────────────────────────────────────
  meal-data 블록의 entries 배열에 끼니마다 한 줄 추가.
    {"d":"2026-08-20","t":"아침","n":"김치찌개, 흰쌀밥","kcal":620,"c":78,"p":26,"f":21}
  d=날짜  t=끼니(아침/점심/저녁/간식)  n=음식  kcal=열량  at=촬영시각(HH:MM)
  c=탄수화물(g)  p=단백질(g)  f=지방(g)   ← 매크로는 없으면 생략 가능

  남긴 음식이 있으면 kcal·c·p·f 는 "실제 먹은 양"으로 넣고, 아래 둘을 덧붙인다.
    "served":880, "ate":0.7      ← 차린 양 880kcal 중 70% 섭취
  다 먹었으면 둘 다 생략한다. 그래프는 언제나 kcal(먹은 양)만 쓴다.

  사진 분석은 추정치다. 양 추정 오차가 커서 ±20~30%, 손이 함께 찍히면 ±15% 안팎이다.
  ────────────────────────────────────────────────────────────
-->
<script id="meal-data" type="application/json">
{
  "config": {
    "goalKcal": null
  },
  "entries": [
  ]
}
</script>

<nav>
  <div class="wrap">
    <div class="brand">송화영<b>.dev</b></div>
    <div class="navlinks">
      <a href="weight.html">체중 기록</a>
      <a href="index.html">← 포트폴리오</a>
    </div>
  </div>
</nav>

<header class="head">
  <div class="wrap">
    <span class="eyebrow">daily meal log</span>
    <h1>매일 식사 기록</h1>
    <p class="sub" id="head-sub">사진으로 추정한 값이라 절대값보다 추세로 봅니다.</p>
  </div>
</header>

<div class="wrap"><div class="stats" id="stats"></div></div>

<section id="chart-sec">
  <div class="wrap">
    <div class="sec-bar">
      <h2 class="sec-title">일별 섭취량</h2>
      <span class="sec-note" id="chart-note"></span>
    </div>
    <div class="chart-card">
      <div class="chart-wrap"><svg id="chart" role="img" aria-label="일별 섭취 칼로리 그래프"></svg></div>
      <div class="legend">
        <span class="lg-c"><i></i>탄수화물</span>
        <span class="lg-p"><i></i>단백질</span>
        <span class="lg-f"><i></i>지방</span>
        <span class="lg-avg"><i></i>7일 평균</span>
        <span class="lg-goal hide" id="lg-goal"><i></i>목표</span>
      </div>
    </div>
  </div>
</section>

<section id="list-sec" style="padding-top:0">
  <div class="wrap">
    <div class="sec-bar">
      <h2 class="sec-title">식사 내역</h2>
      <span class="sec-note" id="list-note"></span>
    </div>
    <div id="list"></div>
  </div>
</section>

<section id="empty-sec" class="hide" style="padding-top:0">
  <div class="wrap">
    <div class="empty">
      <b>아직 기록이 없습니다</b>
      음식 사진을 보내 주시면 분석해서 <code>entries</code> 에 한 줄씩 쌓입니다.
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <span>© 2026 송화영 · Shway Song</span>
    <span id="foot-note">daily meal log</span>
  </div>
</footer>

<script>
(function(){
  var DAY = 86400000, WD = ['일','월','화','수','목','금','토'];
  var raw = JSON.parse(document.getElementById('meal-data').textContent);
  var goal = (typeof (raw.config||{}).goalKcal === 'number') ? raw.config.goalKcal : null;

  var all = (raw.entries || [])
    .filter(function(e){ return e && e.d && typeof e.kcal === 'number'; })
    .map(function(e){
      return { d:e.d, t:e.t || '', n:e.n || '', kcal:e.kcal, at:e.at || '',
               c:e.c||0, p:e.p||0, f:e.f||0,
               /* served = 차린 양(kcal), ate = 먹은 비율. kcal 은 이미 먹은 양이다 */
               served:(typeof e.served === 'number' ? e.served : null),
               ate:(typeof e.ate === 'number' ? e.ate : null),
               t0:new Date(e.d+'T00:00:00').getTime() };
    })
    .sort(function(a,b){ return a.t0 - b.t0; });

  function md(t){ var x=new Date(t); return ('0'+(x.getMonth()+1)).slice(-2)+'.'+('0'+x.getDate()).slice(-2); }
  function full(t){ var x=new Date(t); return x.getFullYear()+'.'+md(t)+' ('+WD[x.getDay()]+')'; }
  function k(v){ return Math.round(v).toLocaleString('en-US'); }

  /* 날짜별 합계 */
  var days = [], byT = {};
  all.forEach(function(e){
    if (!byT[e.t0]){ byT[e.t0] = { t0:e.t0, kcal:0, c:0, p:0, f:0, meals:[] }; days.push(byT[e.t0]); }
    var d = byT[e.t0];
    d.kcal += e.kcal; d.c += e.c; d.p += e.p; d.f += e.f; d.meals.push(e);
  });
  days.sort(function(a,b){ return a.t0 - b.t0; });

  /* 최근 7일(캘린더) 평균 — 기록 없는 날은 빼고 계산 */
  function avg7(t0){
    var from = t0 - 6*DAY, s = 0, n = 0;
    days.forEach(function(d){ if (d.t0 >= from && d.t0 <= t0){ s += d.kcal; n++; } });
    return n ? { v:s/n, n:n } : null;
  }

  function renderStats(){
    var last = days[days.length-1];
    var a = avg7(last.t0);
    var mk = last.c*4 + last.p*4 + last.f*9;
    var pct = function(g, per){ return mk ? Math.round(g*per/mk*100) : 0; };
    var cards = [
      '<div class="stat"><div class="lab">최근 기록일 섭취</div><div class="num">' + k(last.kcal) + '<small> kcal</small></div>' +
      '<div class="note">' + full(last.t0) + ' · ' + last.meals.length + '끼</div></div>',

      '<div class="stat"><div class="lab">탄 · 단 · 지</div><div class="num" style="font-size:1.5rem">' +
      (mk ? pct(last.c,4) + ' · ' + pct(last.p,4) + ' · ' + pct(last.f,9) + '<small> %</small>' : '<small>미기록</small>') + '</div>' +
      '<div class="note">' + (mk ? Math.round(last.c) + ' / ' + Math.round(last.p) + ' / ' + Math.round(last.f) + ' g' : '매크로 없음') + '</div></div>',

      '<div class="stat"><div class="lab">7일 평균</div><div class="num">' + k(a.v) + '<small> kcal</small></div>' +
      '<div class="note">최근 7일 중 ' + a.n + '일 기록</div></div>'
    ];
    if (goal !== null){
      var diff = last.kcal - goal;
      cards.push('<div class="stat"><div class="lab">목표 대비</div>' +
        '<div class="num" style="color:' + (diff > 0 ? 'var(--warm)' : 'var(--teal)') + '">' +
        (diff > 0 ? '+' : diff < 0 ? '−' : '±') + k(Math.abs(diff)) + '<small> kcal</small></div>' +
        '<div class="note">목표 ' + k(goal) + ' kcal</div></div>');
    } else {
      var tot = days.reduce(function(s,d){ return s + d.kcal; }, 0);
      cards.push('<div class="stat"><div class="lab">전체 평균</div><div class="num">' + k(tot/days.length) + '<small> kcal</small></div>' +
        '<div class="note">' + days.length + '일 · ' + all.length + '끼 기록</div></div>');
    }
    document.getElementById('stats').innerHTML = cards.join('');
    document.getElementById('foot-note').textContent = 'last update ' + days[days.length-1].meals[0].d;
  }

  /* 막대그래프 — 최근 14일 캘린더 */
  var SHOW = 14;
  function render(){
    var svg = document.getElementById('chart');
    var W = svg.parentNode.clientWidth || 900;
    var H = W < 520 ? 240 : 300;
    var P = { t:22, r:14, b:30, l:52 };
    var iw = Math.max(10, W - P.l - P.r), ih = Math.max(10, H - P.t - P.b);

    /* 기록 없는 날도 자리를 비워 보여준다 */
    var end = days[days.length-1].t0;
    var start = Math.max(days[0].t0, end - (SHOW-1)*DAY);
    var slots = [];
    for (var t = start; t <= end; t += DAY) slots.push(byT[t] || { t0:t, kcal:0, c:0, p:0, f:0, empty:true });

    var top = Math.max.apply(null, slots.map(function(s){ return s.kcal; }).concat(goal ? [goal] : [0]));
    var step = top > 2500 ? 1000 : 500;
    var yMax = Math.max(step, Math.ceil(top*1.12/step)*step);
    var X = function(i){ return P.l + iw*(i+0.5)/slots.length; };
    var Y = function(v){ return P.t + (1 - v/yMax)*ih; };
    var bw = Math.min(46, iw/slots.length*0.62);

    var s = [];
    s.push('<g class="grid">');
    for (var v = 0; v <= yMax; v += step) s.push('<line x1="'+P.l+'" y1="'+Y(v).toFixed(1)+'" x2="'+(P.l+iw)+'" y2="'+Y(v).toFixed(1)+'"/>');
    s.push('</g><g class="axis">');
    for (var v2 = 0; v2 <= yMax; v2 += step) s.push('<text x="'+(P.l-9)+'" y="'+(Y(v2)+3.5).toFixed(1)+'" text-anchor="end">'+k(v2)+'</text>');
    slots.forEach(function(d,i){
      if (slots.length <= 14 || i % 2 === 0)
        s.push('<text x="'+X(i).toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle">'+md(d.t0)+'</text>');
    });
    s.push('</g>');

    /* 막대: 매크로가 있으면 탄/단/지로 쌓고, 없으면 단색 */
    slots.forEach(function(d,i){
      if (!d.kcal) return;
      var x = X(i) - bw/2, base = Y(0);
      var mk = d.c*4 + d.p*4 + d.f*9;
      var segs = mk ? [[d.c*4/mk*d.kcal,'var(--teal)'],[d.p*4/mk*d.kcal,'var(--ink-soft)'],[d.f*9/mk*d.kcal,'var(--amber)']]
                    : [[d.kcal,'var(--teal)']];
      segs.forEach(function(sg){
        var h = sg[0]/yMax*ih;   /* 세그먼트 높이는 값에 비례 — Y()로 재면 앞 세그먼트만큼 어긋난다 */
        if (h <= 0) return;
        base -= h;
        s.push('<rect x="'+x.toFixed(1)+'" y="'+base.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+sg[1]+'"/>');
      });
      s.push('<text class="barval" x="'+X(i).toFixed(1)+'" y="'+(Y(d.kcal)-7).toFixed(1)+'" text-anchor="middle">'+k(d.kcal)+'</text>');
    });

    /* 7일 평균선 */
    var pts = slots.map(function(d,i){ var a = avg7(d.t0); return a ? (i?'L':'M')+X(i).toFixed(1)+' '+Y(a.v).toFixed(1) : null; }).filter(Boolean);
    if (pts.length > 1) s.push('<path class="line-avg" d="'+pts.join(' ').replace(/^L/,'M')+'"/>');
    if (goal !== null && goal <= yMax) s.push('<line class="line-goal" x1="'+P.l+'" y1="'+Y(goal).toFixed(1)+'" x2="'+(P.l+iw)+'" y2="'+Y(goal).toFixed(1)+'"/>');

    svg.setAttribute('viewBox', '0 0 '+W+' '+H);
    svg.setAttribute('height', H);
    svg.innerHTML = s.join('');
    document.getElementById('chart-note').textContent = slots.length + '일 표시 · 단위 kcal';
  }

  function renderList(){
    var recent = days.slice(-7).reverse();
    document.getElementById('list').innerHTML = recent.map(function(d){
      var mk = d.c*4 + d.p*4 + d.f*9;
      return '<div class="day"><div class="day-head">' +
        '<span class="day-date">' + full(d.t0) + '</span>' +
        '<span class="day-sum"><b>' + k(d.kcal) + ' kcal</b>' +
        (mk ? ' · 탄 ' + Math.round(d.c) + ' / 단 ' + Math.round(d.p) + ' / 지 ' + Math.round(d.f) + ' g' : '') + '</span></div>' +
        d.meals.map(function(m){
          var bits = [];
          if (m.c || m.p || m.f) bits.push('탄 ' + m.c + ' · 단 ' + m.p + ' · 지 ' + m.f + ' g');
          if (m.ate !== null && m.ate < 1)
            bits.push('차린 ' + (m.served !== null ? k(m.served) + ' kcal 중 ' : '') + Math.round(m.ate*100) + '% 섭취');
          return '<div class="meal"><span class="meal-t">' + (m.t||'—') +
            (m.at ? '<span class="meal-at">' + m.at + '</span>' : '') + '</span>' +
            '<span class="meal-n">' + m.n.replace(/</g,'&lt;') +
            (bits.length ? '<span class="macro">' + bits.join(' · ') + '</span>' : '') + '</span>' +
            '<span class="meal-k">' + k(m.kcal) + '</span></div>';
        }).join('') + '</div>';
    }).join('');
    document.getElementById('list-note').textContent =
      days.length > 7 ? '최근 7일 / 전체 ' + days.length + '일' : '전체 ' + days.length + '일';
  }

  if (!days.length){
    ['stats','chart-sec','list-sec'].forEach(function(id){ document.getElementById(id).classList.add('hide'); });
    document.getElementById('empty-sec').classList.remove('hide');
  } else {
    if (goal !== null) document.getElementById('lg-goal').classList.remove('hide');
    renderStats(); renderList(); render();
    var rt;
    window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(render, 120); });
  }
})();
</script>
</body>
</html>
