<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>매일 체중 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#0B2239;
    --ink-soft:#1B3A57;
    --teal:#0E7C7B;
    --teal-deep:#0A5C5B;
    --warm:#C2554D;
    --surface:#FBFCFD;
    --surface-2:#F2F5F7;
    --slate:#5A6B7A;
    --hair:#E2E8ED;
    --max:1080px;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:var(--surface);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--teal);color:#fff}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 28px}

  .eyebrow{
    font-family:var(--mono);font-size:.72rem;letter-spacing:.04em;
    color:var(--teal);font-weight:500;display:inline-block;margin-bottom:14px;
  }
  .eyebrow::before{content:"// "}

  nav{
    position:sticky;top:0;z-index:50;
    backdrop-filter:saturate(160%) blur(10px);
    background:rgba(251,252,253,.82);
    border-bottom:1px solid var(--hair);
  }
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
  .brand{font-family:var(--mono);font-weight:700;font-size:.92rem;letter-spacing:-.01em}
  .brand b{color:var(--teal)}
  .navlinks{display:flex;gap:26px;font-size:.86rem;color:var(--slate)}
  .navlinks a:hover{color:var(--ink)}

  header.head{padding:56px 0 34px}
  .head h1{font-size:clamp(1.7rem,4.4vw,2.5rem);font-weight:800;letter-spacing:-.03em;line-height:1.2}
  .head .sub{margin-top:12px;color:var(--ink-soft);font-size:1rem}

  /* ---------- STATS ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);background:var(--surface-2)}
  .stat{padding:26px 20px;border-left:1px solid var(--hair)}
  .stat:first-child{border-left:none;padding-left:0}
  .stat .lab{font-family:var(--mono);font-size:.7rem;color:var(--slate);letter-spacing:.02em}
  .stat .num{margin-top:8px;font-size:1.85rem;font-weight:800;letter-spacing:-.03em;line-height:1}
  .stat .num small{font-size:.9rem;font-weight:600;color:var(--slate);letter-spacing:0}
  .stat .note{margin-top:7px;font-size:.78rem;color:var(--slate)}
  .down{color:var(--teal)}
  .up{color:var(--warm)}
  @media(max-width:820px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .stat{border-top:1px solid var(--hair)}
    .stat:nth-child(odd){border-left:none;padding-left:0}
    .stat:nth-child(-n+2){border-top:none}
  }

  section{padding:52px 0}
  .sec-title{font-size:1.15rem;font-weight:700;letter-spacing:-.02em}
  .sec-bar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}

  .ranges{display:flex;gap:6px}
  .rbtn{
    font-family:var(--mono);font-size:.74rem;padding:7px 13px;border-radius:7px;
    border:1px solid var(--hair);background:#fff;color:var(--slate);cursor:pointer;
    transition:border-color .18s,color .18s,background .18s;
  }
  .rbtn:hover{border-color:var(--teal);color:var(--teal)}
  .rbtn.on{background:var(--ink);border-color:var(--ink);color:#fff}

  .chart-card{border:1px solid var(--hair);border-radius:12px;background:#fff;padding:18px 16px 12px}
  .chart-wrap{position:relative;width:100%}
  .chart-wrap svg{display:block;width:100%}
  .grid line{stroke:var(--hair)}
  .axis text{font-family:var(--mono);font-size:10px;fill:var(--slate)}
  .line-w{fill:none;stroke:var(--teal);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
  .line-ma{fill:none;stroke:var(--ink-soft);stroke-width:1.4;stroke-dasharray:5 4;opacity:.65}
  .line-target{stroke:var(--warm);stroke-width:1.3;stroke-dasharray:3 4;opacity:.8}
  .dot{fill:#fff;stroke:var(--teal);stroke-width:2}
  .dot-last{fill:var(--teal);stroke:#fff;stroke-width:2.5}
  .hover-line{stroke:var(--ink);stroke-width:1;opacity:.25}
  .hover-dot{fill:var(--ink);stroke:#fff;stroke-width:2}

  .legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;padding:0 4px 4px;font-size:.76rem;color:var(--slate)}
  .legend i{display:inline-block;width:16px;height:0;border-top-width:2px;border-top-style:solid;vertical-align:middle;margin-right:7px}
  .lg-w i{border-color:var(--teal)}
  .lg-ma i{border-color:var(--ink-soft);border-top-style:dashed}
  .lg-t i{border-color:var(--warm);border-top-style:dashed}

  .tip{
    position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;
    background:var(--ink);color:#fff;border-radius:8px;padding:9px 12px;
    font-size:.78rem;line-height:1.45;white-space:nowrap;transform:translate(-50%,-118%);
    box-shadow:0 10px 24px -14px rgba(11,34,57,.7);z-index:5;
  }
  .tip b{font-family:var(--mono);font-size:.86rem;font-weight:700}
  .tip .td{color:#9DB2C2;font-family:var(--mono);font-size:.7rem}

  /* ---------- TABLE ---------- */
  table{width:100%;border-collapse:collapse}
  th,td{padding:12px 10px;text-align:right;font-size:.9rem;border-top:1px solid var(--hair)}
  th{font-family:var(--mono);font-size:.7rem;font-weight:500;color:var(--slate);letter-spacing:.02em;border-top:none}
  th:first-child,td:first-child{text-align:left;padding-left:0}
  th:last-child,td:last-child{padding-right:0}
  td.w{font-family:var(--mono);font-weight:700}
  td.d{font-family:var(--mono);font-size:.82rem;white-space:nowrap}
  @media(max-width:560px){
    th,td{padding:11px 6px}
    td.d{font-size:.76rem}
    .yr{display:none}
    td.memo{font-size:.78rem;max-width:12ch}
  }
  td.memo{color:var(--slate);font-size:.84rem;text-align:left;max-width:24ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  tbody tr:hover{background:var(--surface-2)}

  .empty{
    border:1px dashed var(--hair);border-radius:12px;padding:48px 24px;text-align:center;color:var(--slate);
  }
  .empty b{display:block;color:var(--ink);font-size:1.02rem;margin-bottom:8px}
  .empty code{font-family:var(--mono);font-size:.82rem;background:var(--surface-2);padding:3px 7px;border-radius:5px;color:var(--ink-soft)}

  footer{border-top:1px solid var(--hair);padding:28px 0;background:var(--surface-2);margin-top:24px}
  footer .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
  footer span{font-family:var(--mono);font-size:.72rem;color:var(--slate)}
  .hide{display:none !important}
</style>
</head>
<body>

<!--
  ── 기록 방법 ────────────────────────────────────────────────
  아래 weight-data 블록의 entries 배열에 한 줄씩 추가하면 끝.
    {"d":"2026-08-04","w":73.74}
    {"d":"2026-08-04","w":73.74,"memo":"과식"}   ← memo는 선택
  d = 측정일(YYYY-MM-DD), w = 체중(kg), 정렬은 페이지가 알아서 함.
  config.target(목표 체중) / config.height(키, cm)는 비워두면 관련 표시가 숨겨짐.
  ────────────────────────────────────────────────────────────
-->

<header class="head">

<script>
(function(){
  var DAY = 86400000;
  var raw = JSON.parse(document.getElementById('weight-data').textContent);
  var cfg = raw.config || {};
  var UNIT = cfg.unit || 'kg';
  var target = (typeof cfg.target === 'number') ? cfg.target : null;
  var height = (typeof cfg.height === 'number') ? cfg.height : null;

  var all = (raw.entries || [])
    .filter(function(e){ return e && e.d && typeof e.w === 'number'; })
    .map(function(e){ return { d:e.d, w:e.w, memo:e.memo || '', t:new Date(e.d + 'T00:00:00').getTime() }; })
    .sort(function(a,b){ return a.t - b.t; });

  var WD = ['일','월','화','수','목','금','토'];
  function fmtDate(t){
    var x = new Date(t);
    return ('0'+(x.getMonth()+1)).slice(-2) + '.' + ('0'+x.getDate()).slice(-2);
  }
  function fmtDateFull(t){
    var x = new Date(t);
    return x.getFullYear() + '.' + fmtDate(t) + ' (' + WD[x.getDay()] + ')';
  }
  /* 표에서는 좁은 화면에서 연도를 접을 수 있게 감싼다 */
  function fmtRowDate(t){
    var x = new Date(t);
    return '<span class="yr">' + x.getFullYear() + '.</span>' + fmtDate(t) + ' (' + WD[x.getDay()] + ')';
  }
  /* 입력 정밀도(소수 둘째 자리)를 그대로 보여준다 */
  function nw(v){ return v.toFixed(2); }
  function signed(v){ return (v > 0 ? '+' : v < 0 ? '−' : '±') + nw(Math.abs(v)); }
  function deltaClass(v){ return v < 0 ? 'down' : v > 0 ? 'up' : ''; }

  /* 7일(캘린더 기준) 이동평균 — 기록이 빠진 날이 있어도 안전 */
  function movingAvg(list){
    return list.map(function(e){
      var from = e.t - 6*DAY, sum = 0, n = 0;
      for (var i=0;i<list.length;i++){
        if (list[i].t >= from && list[i].t <= e.t){ sum += list[i].w; n++; }
      }
      return { t:e.t, v:sum/n, n:n };
    });
  }
  var maAll = movingAvg(all);
  var maByT = {};
  maAll.forEach(function(m){ maByT[m.t] = m; });

  /* ---------- 통계 ---------- */
  function streak(list){
    if (!list.length) return 0;
    var s = 1;
    for (var i=list.length-1;i>0;i--){
      var gap = Math.round((list[i].t - list[i-1].t)/DAY);
      if (gap === 1) s++; else break;
    }
    return s;
  }

  function renderStats(){
    var el = document.getElementById('stats');
    if (!all.length){ el.innerHTML = ''; return; }
    var last = all[all.length-1];
    var prev = all.length > 1 ? all[all.length-2] : null;
    var first = all[0];
    var ma = maByT[last.t];
    var cards = [];

    cards.push(
      '<div class="stat"><div class="lab">최신 체중</div>' +
      '<div class="num">' + nw(last.w) + '<small> ' + UNIT + '</small></div>' +
      '<div class="note">' + fmtDateFull(last.t) + ' 측정</div></div>'
    );

    if (prev){
      var dPrev = last.w - prev.w;
      var gap = Math.round((last.t - prev.t)/DAY);
      cards.push(
        '<div class="stat"><div class="lab">직전 기록 대비</div>' +
        '<div class="num ' + deltaClass(dPrev) + '">' + signed(dPrev) + '<small> ' + UNIT + '</small></div>' +
        '<div class="note">' + (gap === 1 ? '어제' : gap + '일 전') + ' ' + nw(prev.w) + ' ' + UNIT + '</div></div>'
      );
    } else {
      cards.push('<div class="stat"><div class="lab">직전 기록 대비</div><div class="num"><small>기록 2일차부터</small></div><div class="note">첫 기록입니다</div></div>');
    }

    cards.push(
      '<div class="stat"><div class="lab">7일 평균</div>' +
      '<div class="num">' + nw(ma.v) + '<small> ' + UNIT + '</small></div>' +
      '<div class="note">최근 7일 중 ' + ma.n + '회 기록</div></div>'
    );

    if (target !== null){
      var toGo = last.w - target;
      cards.push(
        '<div class="stat"><div class="lab">목표까지</div>' +
        '<div class="num ' + (toGo <= 0 ? 'down' : '') + '">' + (toGo <= 0 ? '달성' : nw(toGo)) + (toGo > 0 ? '<small> ' + UNIT + '</small>' : '') + '</div>' +
        '<div class="note">목표 ' + nw(target) + ' ' + UNIT +
        (toGo < 0 ? ' · ' + nw(-toGo) + ' ' + UNIT + ' 아래' : '') + '</div></div>'
      );
    } else {
      var dStart = last.w - first.w;
      cards.push(
        '<div class="stat"><div class="lab">시작 대비</div>' +
        '<div class="num ' + deltaClass(dStart) + '">' + signed(dStart) + '<small> ' + UNIT + '</small></div>' +
        '<div class="note">' + fmtDateFull(first.t) + ' ' + nw(first.w) + ' ' + UNIT + '</div></div>'
      );
    }
    el.innerHTML = cards.join('');

    var bits = [];
    bits.push('기록 ' + all.length + '일');
    if (streak(all) > 1) bits.push('연속 ' + streak(all) + '일');
    if (height) bits.push('BMI ' + (last.w / Math.pow(height/100, 2)).toFixed(1));
    if (target === null && all.length > 1) bits.push('시작 ' + nw(first.w) + ' ' + UNIT);
    document.getElementById('head-sub').textContent =
      '일어나서 잰 숫자 하나를 매일 같은 조건으로 쌓습니다. · ' + bits.join(' · ');
    document.getElementById('foot-note').textContent = 'last update ' + all[all.length-1].d;
  }

  /* ---------- 차트 ---------- */
  var state = { range: 0 };

  function visible(){
    if (!state.range || !all.length) return all.slice();
    var cut = all[all.length-1].t - (state.range-1)*DAY;
    return all.filter(function(e){ return e.t >= cut; });
  }

  function niceScale(min, max, ticks){
    var span = (max - min) || 1;
    var raw = span/ticks;
    var mag = Math.pow(10, Math.floor(Math.log10(raw)));
    var norm = raw/mag;
    var step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
    return { min: Math.floor(min/step)*step, max: Math.ceil(max/step)*step, step: step };
  }

  var pts = [];   // 화면 좌표 캐시 (툴팁용)
  function render(){
    var svg = document.getElementById('chart');
    var data = visible();
    if (!data.length){ svg.innerHTML = ''; pts = []; return; }

    var W = document.getElementById('chart-wrap').clientWidth || 720;
    var H = W < 520 ? 220 : 300;
    var P = { t:18, r:16, b:28, l:44 };
    var iw = Math.max(10, W - P.l - P.r);
    var ih = Math.max(10, H - P.t - P.b);

    var vals = data.map(function(e){ return e.w; });
    data.forEach(function(e){ vals.push(maByT[e.t].v); });
    if (target !== null) vals.push(target);
    var lo = Math.min.apply(null, vals);
    var hi = Math.max.apply(null, vals);
    var pad = Math.max((hi - lo) * 0.15, 0.4);
    var sc = niceScale(lo - pad, hi + pad, 4);
    var dec = Math.max(0, -Math.floor(Math.log10(sc.step)));

    var t0 = data[0].t, t1 = data[data.length-1].t;
    function X(t){ return t1 === t0 ? P.l + iw/2 : P.l + (t - t0)/(t1 - t0)*iw; }
    function Y(v){ return P.t + (sc.max - v)/(sc.max - sc.min)*ih; }

    var s = [];
    /* grid + y축 */
    s.push('<g class="grid">');
    for (var v = sc.min; v <= sc.max + 1e-9; v += sc.step){
      s.push('<line x1="' + P.l + '" y1="' + Y(v).toFixed(1) + '" x2="' + (P.l+iw) + '" y2="' + Y(v).toFixed(1) + '"/>');
    }
    s.push('</g><g class="axis">');
    for (var v2 = sc.min; v2 <= sc.max + 1e-9; v2 += sc.step){
      s.push('<text x="' + (P.l-9) + '" y="' + (Y(v2)+3.5).toFixed(1) + '" text-anchor="end">' + v2.toFixed(dec) + '</text>');
    }
    /* x축 라벨: 좁은 화면일수록 성기게, 겹치면 생략 */
    var maxLab = W < 520 ? 3 : 5;
    var stepI = Math.max(1, Math.ceil(data.length/maxLab));
    var minGap = 46, lastX = -Infinity;
    for (var i = 0; i < data.length; i += stepI){
      var xi = X(data[i].t);
      if (xi - lastX < minGap) continue;
      lastX = xi;
      s.push('<text x="' + xi.toFixed(1) + '" y="' + (H-8) + '" text-anchor="middle">' + fmtDate(data[i].t) + '</text>');
    }
    if (data.length > 1 && X(t1) - lastX >= minGap){
      s.push('<text x="' + X(t1).toFixed(1) + '" y="' + (H-8) + '" text-anchor="end">' + fmtDate(t1) + '</text>');
    }
    s.push('</g>');

    /* 목표선 */
    if (target !== null && target >= sc.min && target <= sc.max){
      s.push('<line class="line-target" x1="' + P.l + '" y1="' + Y(target).toFixed(1) + '" x2="' + (P.l+iw) + '" y2="' + Y(target).toFixed(1) + '"/>');
    }

    /* 면 채우기 + 라인 */
    var dW = data.map(function(e,i){ return (i?'L':'M') + X(e.t).toFixed(1) + ' ' + Y(e.w).toFixed(1); }).join(' ');
    var area = dW + ' L' + X(t1).toFixed(1) + ' ' + (P.t+ih) + ' L' + X(t0).toFixed(1) + ' ' + (P.t+ih) + ' Z';
    s.push('<defs><linearGradient id="fadeT" x1="0" y1="0" x2="0" y2="1">' +
           '<stop offset="0%" stop-color="#0E7C7B" stop-opacity=".16"/>' +
           '<stop offset="100%" stop-color="#0E7C7B" stop-opacity="0"/></linearGradient></defs>');
    s.push('<path d="' + area + '" fill="url(#fadeT)"/>');

    if (data.length > 1){
      var dMA = data.map(function(e,i){ return (i?'L':'M') + X(e.t).toFixed(1) + ' ' + Y(maByT[e.t].v).toFixed(1); }).join(' ');
      s.push('<path class="line-ma" d="' + dMA + '"/>');
    }
    s.push('<path class="line-w" d="' + dW + '"/>');

    /* 점 */
    pts = data.map(function(e){ return { x:X(e.t), y:Y(e.w), e:e }; });
    var showDots = data.length <= 60;
    pts.forEach(function(p, i){
      var last = i === pts.length-1;
      if (showDots || last){
        s.push('<circle class="' + (last ? 'dot-last' : 'dot') + '" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + (last ? 4.5 : 3.2) + '"/>');
      }
    });

    s.push('<g id="hover" style="display:none">' +
           '<line class="hover-line" y1="' + P.t + '" y2="' + (P.t+ih) + '"/>' +
           '<circle class="hover-dot" r="4"/></g>');
    s.push('<rect id="cap" x="' + P.l + '" y="' + P.t + '" width="' + iw + '" height="' + ih + '" fill="transparent" style="touch-action:none"/>');

    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('height', H);
    svg.innerHTML = s.join('');
    bindHover(svg, W);
  }

  function bindHover(svg, W){
    var cap = svg.querySelector('#cap');
    var g = svg.querySelector('#hover');
    var line = g.querySelector('line');
    var dot = g.querySelector('circle');
    var tip = document.getElementById('tip');
    if (!cap) return;

    function move(ev){
      var box = svg.getBoundingClientRect();
      var x = (ev.clientX - box.left) * (W / box.width);
      var best = null, bd = Infinity;
      pts.forEach(function(p){
        var d = Math.abs(p.x - x);
        if (d < bd){ bd = d; best = p; }
      });
      if (!best) return;
      g.style.display = '';
      line.setAttribute('x1', best.x); line.setAttribute('x2', best.x);
      dot.setAttribute('cx', best.x); dot.setAttribute('cy', best.y);

      var idx = all.indexOf(best.e);
      var prev = idx > 0 ? all[idx-1] : null;
      var d1 = prev ? best.e.w - prev.w : null;
      tip.innerHTML = '<span class="td">' + fmtDateFull(best.e.t) + '</span><br>' +
        '<b>' + nw(best.e.w) + ' ' + UNIT + '</b>' +
        (d1 !== null ? ' <span style="color:' + (d1 < 0 ? '#5FD0CE' : d1 > 0 ? '#F0A29B' : '#9DB2C2') + '">' + signed(d1) + '</span>' : '') +
        (best.e.memo ? '<br><span class="td">' + best.e.memo.replace(/</g,'&lt;') + '</span>' : '');
      var wrapW = svg.getBoundingClientRect().width;
      var scale = wrapW / W;
      var half = tip.offsetWidth / 2 + 4;
      tip.style.left = Math.max(half, Math.min(wrapW - half, best.x * scale)) + 'px';
      tip.style.top = (best.y * scale) + 'px';
      tip.style.opacity = 1;
    }
    function leave(){ g.style.display = 'none'; document.getElementById('tip').style.opacity = 0; }

    cap.addEventListener('pointermove', move);
    cap.addEventListener('pointerdown', move);
    cap.addEventListener('pointerleave', leave);
  }

  /* ---------- 표 ---------- */
  function renderTable(){
    var tb = document.getElementById('tbody');
    var recent = all.slice(-14).reverse();
    tb.innerHTML = recent.map(function(e){
      var idx = all.indexOf(e);
      var prev = idx > 0 ? all[idx-1] : null;
      var d = prev ? e.w - prev.w : null;
      return '<tr>' +
        '<td class="d">' + fmtRowDate(e.t) + '</td>' +
        '<td class="memo">' + (e.memo ? e.memo.replace(/</g,'&lt;') : '') + '</td>' +
        '<td class="' + (d === null ? '' : deltaClass(d)) + '">' + (d === null ? '—' : signed(d)) + '</td>' +
        '<td class="w">' + nw(e.w) + '</td>' +
      '</tr>';
    }).join('');
    document.getElementById('table-count').textContent =
      all.length > 14 ? '최근 14일 / 전체 ' + all.length + '일' : '전체 ' + all.length + '일';
  }

  /* ---------- 부팅 ---------- */
  if (!all.length){
    document.getElementById('stats').classList.add('hide');
    document.getElementById('chart-sec').classList.add('hide');
    document.getElementById('table-sec').classList.add('hide');
    document.getElementById('empty-sec').classList.remove('hide');
  } else {
    if (target !== null) document.getElementById('lg-target').classList.remove('hide');
    renderStats();
    renderTable();
    render();

    document.getElementById('ranges').addEventListener('click', function(ev){
      var b = ev.target.closest('.rbtn');
      if (!b) return;
      state.range = parseInt(b.dataset.range, 10);
      Array.prototype.forEach.call(this.querySelectorAll('.rbtn'), function(x){ x.classList.toggle('on', x === b); });
      render();
    });

    var rt;
    window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(render, 120); });
  }
})();
</script>
</body>
</html>
