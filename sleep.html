<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>매일 수면 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#0B2239; --ink-soft:#1B3A57; --teal:#0E7C7B; --teal-deep:#0A5C5B;
    --warm:#C2554D; --indigo:#4C5FA8;
    --surface:#FBFCFD; --surface-2:#F2F5F7; --slate:#5A6B7A; --hair:#E2E8ED;
    --max:1080px;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--surface);line-height:1.6;-webkit-font-smoothing:antialiased}
  ::selection{background:var(--teal);color:#fff}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 28px}
  .eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.04em;color:var(--teal);font-weight:500;display:inline-block;margin-bottom:14px}
  .eyebrow::before{content:"// "}

  nav{position:sticky;top:0;z-index:50;backdrop-filter:saturate(160%) blur(10px);background:rgba(251,252,253,.82);border-bottom:1px solid var(--hair)}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
  .brand{font-family:var(--mono);font-weight:700;font-size:.92rem;letter-spacing:-.01em}
  .brand b{color:var(--teal)}
  .navlinks{display:flex;gap:20px;font-size:.86rem;color:var(--slate)}
  .navlinks a:hover{color:var(--ink)}

  header.head{padding:56px 0 34px}
  .head h1{font-size:clamp(1.7rem,4.4vw,2.5rem);font-weight:800;letter-spacing:-.03em;line-height:1.2}
  .head .sub{margin-top:12px;color:var(--ink-soft);font-size:1rem}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);background:var(--surface-2)}
  .stat{padding:26px 20px;border-left:1px solid var(--hair)}
  .stat:first-child{border-left:none;padding-left:0}
  .stat .lab{font-family:var(--mono);font-size:.7rem;color:var(--slate);letter-spacing:.02em}
  .stat .num{margin-top:8px;font-size:1.85rem;font-weight:800;letter-spacing:-.03em;line-height:1}
  .stat .num small{font-size:.9rem;font-weight:600;color:var(--slate);letter-spacing:0}
  .stat .note{margin-top:7px;font-size:.78rem;color:var(--slate)}
  @media(max-width:820px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .stat{border-top:1px solid var(--hair)}
    .stat:nth-child(odd){border-left:none;padding-left:0}
    .stat:nth-child(-n+2){border-top:none}
  }

  section{padding:52px 0}
  .sec-title{font-size:1.15rem;font-weight:700;letter-spacing:-.02em}
  .sec-bar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .sec-note{font-family:var(--mono);font-size:.72rem;color:var(--slate)}

  .chart-card{border:1px solid var(--hair);border-radius:12px;background:#fff;padding:18px 16px 12px}
  .chart-wrap{width:100%}
  .chart-wrap svg{display:block;width:100%}
  .grid line{stroke:var(--hair)}
  .axis text{font-family:var(--mono);font-size:10px;fill:var(--slate)}
  .rowlab{font-family:var(--mono);font-size:10px;fill:var(--slate)}
  .durlab{font-family:var(--mono);font-size:10px;font-weight:700;fill:var(--ink-soft)}
  .band{fill:var(--indigo);opacity:.85}
  .band-deep{fill:var(--ink)}
  .midnight{stroke:var(--warm);stroke-width:1.2;stroke-dasharray:3 3;opacity:.7}

  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;padding:0 4px 4px;font-size:.76rem;color:var(--slate)}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:6px}
  .lg-s i{background:var(--indigo)}
  .lg-m i{width:16px;height:0;border-radius:0;border-top:2px dashed var(--warm);vertical-align:middle}

  table{width:100%;border-collapse:collapse}
  th,td{padding:12px 10px;text-align:right;font-size:.9rem;border-top:1px solid var(--hair)}
  th{font-family:var(--mono);font-size:.7rem;font-weight:500;color:var(--slate);letter-spacing:.02em;border-top:none}
  th:first-child,td:first-child{text-align:left;padding-left:0}
  th:last-child,td:last-child{padding-right:0}
  td.d{font-family:var(--mono);font-size:.82rem;white-space:nowrap}
  td.t{font-family:var(--mono);font-size:.84rem}
  td.dur{font-family:var(--mono);font-weight:700}
  td.q{color:var(--slate);font-size:.84rem}
  tbody tr:hover{background:var(--surface-2)}
  @media(max-width:560px){
    th,td{padding:11px 6px}
    td.d{font-size:.76rem}
    .yr{display:none}
  }

  .empty{border:1px dashed var(--hair);border-radius:12px;padding:48px 24px;text-align:center;color:var(--slate)}
  .empty b{display:block;color:var(--ink);font-size:1.02rem;margin-bottom:8px}
  .empty code{font-family:var(--mono);font-size:.82rem;background:var(--surface-2);padding:3px 7px;border-radius:5px;color:var(--ink-soft)}

  footer{border-top:1px solid var(--hair);padding:28px 0;background:var(--surface-2);margin-top:24px}
  footer .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
  footer span{font-family:var(--mono);font-size:.72rem;color:var(--slate)}
  .hide{display:none !important}
</style>
</head>
<body>

<!--
  ── 기록 방법 ────────────────────────────────────────────────
  sleep-data 블록의 entries 배열에 하룻밤마다 한 줄 추가.
    {"d":"2026-08-26","bed":"21:31","wake":"06:31","min":540,"q":"좋음"}
  d    = **잠자리에 든 날짜**. 그날 밤의 기록이므로 같은 날 식사·체중과 나란히 놓인다.
         앱(삼성헬스 등)은 보통 "기상 날짜"로 표시하니 하루를 빼서 적는다.
         예) 앱 화면 "8월 27일, 21:31 취침 / 06:31 기상" → d 는 2026-08-26
  bed  = 잠든 시각,  wake = 기상 시각
  min  = 앱이 알려준 총 수면 시간(분). 생략하면 bed~wake 로 계산한다.
         (중간에 깬 시간이 있으면 min 이 bed~wake 보다 짧다)
  q    = 수면 품질 라벨 (선택).  deep = 깊은 수면 분 (선택, 고급 모니터링 켤 때만 나옴)
  ────────────────────────────────────────────────────────────
-->
<script id="sleep-data" type="application/json">
{
  "config": {
    "targetMin": null
  },
  "entries": [
    {"d":"2026-08-26","bed":"21:31","wake":"06:31","min":540,"q":"좋음"}
  ]
}
</script>

<nav>
  <div class="wrap">
    <div class="brand">송화영<b>.dev</b></div>
    <div class="navlinks">
      <a href="weight.html">체중</a>
      <a href="meal.html">식사</a>
      <a href="index.html">← 포트폴리오</a>
    </div>
  </div>
</nav>

<header class="head">
  <div class="wrap">
    <span class="eyebrow">daily sleep log</span>
    <h1>매일 수면 기록</h1>
    <p class="sub" id="head-sub">언제 자고 언제 일어났는지를 쌓아 규칙성을 봅니다.</p>
  </div>
</header>

<div class="wrap"><div class="stats" id="stats"></div></div>

<section id="chart-sec">
  <div class="wrap">
    <div class="sec-bar">
      <h2 class="sec-title">수면 시간대</h2>
      <span class="sec-note" id="chart-note"></span>
    </div>
    <div class="chart-card">
      <div class="chart-wrap"><svg id="chart" role="img" aria-label="밤별 수면 시간대 그래프"></svg></div>
      <div class="legend">
        <span class="lg-s"><i></i>취침~기상 구간 (막대 끝 숫자는 실제 수면시간)</span>
        <span class="lg-m"><i></i>자정</span>
      </div>
    </div>
  </div>
</section>

<section id="table-sec" style="padding-top:0">
  <div class="wrap">
    <div class="sec-bar">
      <h2 class="sec-title">최근 기록</h2>
      <span class="sec-note" id="table-note"></span>
    </div>
    <table>
      <thead><tr><th>밤</th><th>품질</th><th>취침</th><th>기상</th><th>수면</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</section>

<section id="empty-sec" class="hide" style="padding-top:0">
  <div class="wrap">
    <div class="empty">
      <b>아직 기록이 없습니다</b>
      수면 앱 화면을 캡처해 보내 주시면 <code>entries</code> 에 한 줄씩 쌓입니다.
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <span>© 2026 송화영 · Shway Song</span>
    <span id="foot-note">daily sleep log</span>
  </div>
</footer>

<script>
(function(){
  var WD = ['일','월','화','수','목','금','토'];
  var raw = JSON.parse(document.getElementById('sleep-data').textContent);
  var target = (typeof (raw.config||{}).targetMin === 'number') ? raw.config.targetMin : null;

  function hm(s){ var p = String(s||'').split(':'); return (+p[0])*60 + (+p[1] || 0); }
  /* 18:00 을 0 으로 두는 축 — 저녁부터 다음 날 정오까지 18시간 */
  function axisPos(minOfDay){ return ((minOfDay - 18*60) + 1440) % 1440; }
  function dur(hhmm){ var h = Math.floor(hhmm/60), m = hhmm%60; return m ? h+'시간 '+m+'분' : h+'시간'; }

  var all = (raw.entries || [])
    .filter(function(e){ return e && e.d && e.bed && e.wake; })
    .map(function(e){
      var b = hm(e.bed), w = hm(e.wake);
      var span = ((w - b) + 1440) % 1440;              // 침대에 있던 시간
      return { d:e.d, bed:e.bed, wake:e.wake, b:b, w:w, span:span,
               min:(typeof e.min === 'number' ? e.min : span),
               q:e.q || '', deep:(typeof e.deep === 'number' ? e.deep : null),
               t0:new Date(e.d+'T00:00:00').getTime() };
    })
    .sort(function(a,b){ return a.t0 - b.t0; });

  function md(t){ var x=new Date(t); return ('0'+(x.getMonth()+1)).slice(-2)+'.'+('0'+x.getDate()).slice(-2); }
  function rowDate(t){ var x=new Date(t); return '<span class="yr">'+x.getFullYear()+'.</span>'+md(t)+' ('+WD[x.getDay()]+')'; }
  function full(t){ var x=new Date(t); return x.getFullYear()+'.'+md(t)+' ('+WD[x.getDay()]+')'; }

  function avg7(i){
    var from = all[i].t0 - 6*86400000, s=0, n=0;
    all.forEach(function(e){ if (e.t0 >= from && e.t0 <= all[i].t0){ s += e.min; n++; } });
    return { v:s/n, n:n };
  }

  function renderStats(){
    var last = all[all.length-1], a = avg7(all.length-1);
    var cards = [
      '<div class="stat"><div class="lab">어젯밤 수면</div><div class="num">' + dur(last.min) + '</div>' +
      '<div class="note">' + full(last.t0) + ' 밤</div></div>',

      '<div class="stat"><div class="lab">취침 → 기상</div><div class="num" style="font-size:1.5rem">' +
      last.bed + ' → ' + last.wake + '</div>' +
      '<div class="note">' + (last.min < last.span ? '중간에 깬 시간 ' + (last.span-last.min) + '분' : '침대 시간 그대로') + '</div></div>',

      '<div class="stat"><div class="lab">7일 평균</div><div class="num">' + dur(Math.round(a.v)) + '</div>' +
      '<div class="note">최근 7일 중 ' + a.n + '일 기록</div></div>'
    ];
    if (target !== null){
      var diff = last.min - target;
      cards.push('<div class="stat"><div class="lab">목표 대비</div>' +
        '<div class="num" style="color:' + (diff < 0 ? 'var(--warm)' : 'var(--teal)') + '">' +
        (diff>0?'+':diff<0?'−':'±') + Math.abs(diff) + '<small> 분</small></div>' +
        '<div class="note">목표 ' + dur(target) + '</div></div>');
    } else {
      /* 취침 시각이 얼마나 일정한지 — 규칙성이 총량만큼 중요하다 */
      var beds = all.map(function(e){ return axisPos(e.b); });
      var m = beds.reduce(function(s,v){ return s+v; },0)/beds.length;
      var sd = Math.sqrt(beds.reduce(function(s,v){ return s+(v-m)*(v-m); },0)/beds.length);
      cards.push('<div class="stat"><div class="lab">취침 시각 편차</div>' +
        '<div class="num">' + (all.length>1 ? '±'+Math.round(sd)+'<small> 분</small>' : '<small>2일차부터</small>') + '</div>' +
        '<div class="note">' + (all.length>1 ? '기록 '+all.length+'일 기준' : '첫 기록입니다') + '</div></div>');
    }
    document.getElementById('stats').innerHTML = cards.join('');
    var bits = ['기록 ' + all.length + '일'];
    if (last.q) bits.push('품질 ' + last.q);
    document.getElementById('head-sub').textContent =
      '언제 자고 언제 일어났는지를 쌓아 규칙성을 봅니다. · ' + bits.join(' · ');
    document.getElementById('foot-note').textContent = 'last update ' + last.d;
  }

  var SHOW = 14;
  function render(){
    var svg = document.getElementById('chart');
    var rows = all.slice(-SHOW);
    var W = svg.parentNode.clientWidth || 900;
    var RH = 26, P = { t:26, r:52, b:26, l:74 };
    var H = P.t + P.b + rows.length*RH;
    var iw = Math.max(10, W - P.l - P.r);
    var SPAN = 18*60;                                  // 18:00 ~ 다음날 12:00
    var X = function(p){ return P.l + Math.max(0, Math.min(SPAN, p))/SPAN*iw; };

    var s = [];
    s.push('<g class="grid">');
    for (var h = 0; h <= 18; h += 3)
      s.push('<line x1="'+X(h*60).toFixed(1)+'" y1="'+P.t+'" x2="'+X(h*60).toFixed(1)+'" y2="'+(H-P.b)+'"/>');
    s.push('</g><g class="axis">');
    for (var h2 = 0; h2 <= 18; h2 += 3){
      var lab = ((18 + h2) % 24);
      s.push('<text x="'+X(h2*60).toFixed(1)+'" y="'+(P.t-9)+'" text-anchor="middle">'+('0'+lab).slice(-2)+':00</text>');
    }
    s.push('</g>');
    /* 자정선 */
    s.push('<line class="midnight" x1="'+X(6*60).toFixed(1)+'" y1="'+(P.t-4)+'" x2="'+X(6*60).toFixed(1)+'" y2="'+(H-P.b)+'"/>');

    rows.forEach(function(e, i){
      var y = P.t + i*RH + 4, bh = RH - 10;
      var x0 = X(axisPos(e.b)), x1 = X(axisPos(e.b) + e.span);
      s.push('<text class="rowlab" x="'+(P.l-10)+'" y="'+(y+bh/2+3.5).toFixed(1)+'" text-anchor="end">'+md(e.t0)+'</text>');
      s.push('<rect class="band" x="'+x0.toFixed(1)+'" y="'+y+'" width="'+Math.max(2,x1-x0).toFixed(1)+'" height="'+bh+'" rx="3"/>');
      s.push('<text class="durlab" x="'+(x1+7).toFixed(1)+'" y="'+(y+bh/2+3.5).toFixed(1)+'">'+(e.min/60).toFixed(1)+'h</text>');
    });

    svg.setAttribute('viewBox', '0 0 '+W+' '+H);
    svg.setAttribute('height', H);
    svg.innerHTML = s.join('');
    document.getElementById('chart-note').textContent = rows.length + '일 표시 · 18시 ~ 다음날 12시';
  }

  function renderTable(){
    var rows = all.slice(-14).reverse();
    document.getElementById('tbody').innerHTML = rows.map(function(e){
      return '<tr><td class="d">' + rowDate(e.t0) + '</td>' +
        '<td class="q">' + (e.q||'') + '</td>' +
        '<td class="t">' + e.bed + '</td><td class="t">' + e.wake + '</td>' +
        '<td class="dur">' + dur(e.min) + '</td></tr>';
    }).join('');
    document.getElementById('table-note').textContent =
      all.length > 14 ? '최근 14일 / 전체 ' + all.length + '일' : '전체 ' + all.length + '일';
  }

  if (!all.length){
    ['stats','chart-sec','table-sec'].forEach(function(id){ document.getElementById(id).classList.add('hide'); });
    document.getElementById('empty-sec').classList.remove('hide');
  } else {
    renderStats(); renderTable(); render();
    var rt;
    window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(render, 120); });
  }
})();
</script>
</body>
</html>
